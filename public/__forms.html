<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Static copies so Netlify Forms detects every form at deploy time. Keep field names in sync with components/EnquiryForm.tsx. -->
<form name="get-started" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="phone"><input name="country"><input name="interest"><input name="heard"><textarea name="message"></textarea><input name="consent">
</form>
<form name="fund-brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="country"><input name="interest"><input name="consent">
</form>
<form name="appointment" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="phone"><input name="country"><input name="interest"><input name="preferred_date"><input name="preferred_time"><input name="timezone"><input name="consent">
</form>
</body></html>
